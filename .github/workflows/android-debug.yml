name: ADS Jarvis Standalone Android Debug
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager missing under $SDK_ROOT"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and test independent command engine
        run: |
          mkdir -p /tmp/ads-jarvis-tests
          javac -d /tmp/ads-jarvis-tests app/src/main/java/com/adsjarvis/standalone/CommandEngine.java tests/CommandEngineSmokeTest.java
          java -cp /tmp/ads-jarvis-tests com.adsjarvis.standalone.CommandEngineSmokeTest
      - name: Build isolated debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ads-jarvis-standalone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish standalone debug APK as GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v0.4-hud-debug'
          apk='app/build/outputs/apk/debug/app-debug.apk'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#ADS-Jarvis-Android-v0.4-debug.apk" --clobber
          else
            gh release create "$tag" "$apk#ADS-Jarvis-Android-v0.4-debug.apk" --title 'ADS Jarvis Android v0.4 (DEBUG)' --notes 'Standalone prototype only. Local voice and commands; cloud AI not connected. Test APK; not a production release.' --prerelease --target "$GITHUB_SHA"
          fi
