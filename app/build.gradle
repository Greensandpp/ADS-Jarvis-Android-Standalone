plugins { id 'com.android.application' }

android {
    namespace 'com.adsjarvis.standalone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adsjarvis.standalone'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0.0'
        buildConfigField 'String', 'GIT_SHA', "\"${System.getenv('GITHUB_SHA') ?: 'local-build'}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            // Installs BESIDE the existing v0.4 app (com.adsjarvis.standalone); never overwrites it.
            applicationIdSuffix '.jarvis'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions { unitTests.returnDefaultValues = false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (Android provides it at runtime).
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
